# ============================================================================
# BasicSR 测试配置文件模板
#
# 用于测试/推理已训练好的模型
#
# 使用说明:
# 1. 复制此文件到 options/test/YourNet/ 目录
# 2. 重命名为 test_YourNet.yml
# 3. 修改网络参数和模型路径
# 4. 运行: python basicsr/test.py -opt options/test/YourNet/test_YourNet.yml
# ============================================================================

# ====== 基本信息 ======
name: MyNet_test_Set5         # 测试任务名称
model_type: SRModel           # 模型类型（必须与训练时一致）
scale: 4                      # 超分倍数
num_gpu: 1                    # 使用的 GPU 数量，0 表示 CPU
manual_seed: 0                # 随机种子

# ====== 数据集配置 ======
datasets:
  test_1:                     # 第一个测试集
    name: Set5                # 测试集名称
    type: PairedImageDataset  # 数据集类型

    # 数据路径
    dataroot_gt: datasets/Set5/GTmod12         # GT 图像路径（用于计算指标）
    dataroot_lq: datasets/Set5/LRbicx4         # LQ 图像路径（输入）

    # IO 后端
    io_backend:
      type: disk

  test_2:                     # 第二个测试集（可选）
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/GTmod12
    dataroot_lq: datasets/Set14/LRbicx4
    io_backend:
      type: disk

  # 可以添加更多测试集...

# ====== 网络配置 ======
network_g:
  type: MyNet                 # 网络类型（必须与训练时一致）
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 16
  upscale: 4
  # 所有参数必须与训练时完全一致

# ====== 模型路径 ======
path:
  pretrain_network_g: experiments/MyNet_x4_DIV2K/models/net_g_latest.pth  # 预训练模型路径
  strict_load_g: true         # 是否严格加载模型参数
  param_key_g: params         # 参数键名: params | params_ema

  # 结果保存路径（可选，会自动生成）
  # results_root: results/

# ====== 验证/测试配置 ======
val:
  save_img: true              # 是否保存输出图像
  suffix: ~                   # 输出图像后缀，~ 表示使用模型名称

  # 评估指标
  metrics:
    psnr:                     # PSNR 指标
      type: calculate_psnr
      crop_border: 4          # 裁剪边界像素
      test_y_channel: false   # 是否只在 Y 通道（亮度）计算

    ssim:                     # SSIM 指标
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

    # LPIPS 指标（可选，需要安装 lpips 库）
    # lpips:
    #   type: calculate_lpips
    #   better: lower         # 越低越好


# ============================================================================
# 常用测试场景
# ============================================================================

# --- 场景 1: 标准测试（有 GT，计算指标） ---
# datasets:
#   test_1:
#     dataroot_gt: path/to/GT
#     dataroot_lq: path/to/LQ
# val:
#   save_img: true
#   metrics: {psnr, ssim, ...}

# --- 场景 2: 纯推理（无 GT，只生成图像） ---
# datasets:
#   test_1:
#     type: SingleImageDataset
#     dataroot_lq: path/to/LQ
# val:
#   save_img: true
#   # metrics: ~  # 不计算指标

# --- 场景 3: 测试 EMA 模型 ---
# path:
#   param_key_g: params_ema   # 使用 EMA 参数

# --- 场景 4: 批量测试多个模型 ---
# 创建多个配置文件，每个指向不同的模型:
# test_MyNet_100k.yml -> models/net_g_100000.pth
# test_MyNet_200k.yml -> models/net_g_200000.pth
# ...


# ============================================================================
# 运行命令
# ============================================================================

# 基础测试:
#   python basicsr/test.py -opt this_config.yml

# GPU 指定:
#   CUDA_VISIBLE_DEVICES=0 python basicsr/test.py -opt this_config.yml

# CPU 测试:
#   修改 num_gpu: 0，然后运行上述命令

# 多数据集测试:
#   配置文件中添加 test_1, test_2, test_3...
#   脚本会自动测试所有数据集并分别输出结果


# ============================================================================
# 输出文件
# ============================================================================

# 运行后会生成:
# results/
# └── MyNet_test_Set5/              # 结果根目录
#     ├── visualization/            # 可视化结果
#     │   ├── Set5/                # 第一个测试集
#     │   │   ├── baby.png
#     │   │   ├── bird.png
#     │   │   └── ...
#     │   └── Set14/               # 第二个测试集
#     │       └── ...
#     └── test_MyNet_test_Set5_20250127_153045.log  # 测试日志


# ============================================================================
# 常见问题
# ============================================================================

# Q1: 如何测试单张图像？
# A: 创建 SingleImageDataset 数据集
#    datasets:
#      test:
#        type: SingleImageDataset
#        dataroot_lq: path/to/single_image.png

# Q2: 如何保存中间特征？
# A: 需要修改 Model 类，在 test() 方法中保存

# Q3: 如何对比多个模型？
# A: 创建多个配置文件，每个指向不同的模型，批量运行

# Q4: 输出图像格式？
# A: 默认 PNG，可以在 Model 的 save() 方法中修改

