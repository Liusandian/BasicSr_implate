# ============================================================================
# BasicSR 训练配置文件模板
#
# 用于配置网络训练的所有超参数
#
# 使用说明:
# 1. 复制此文件到 options/train/YourNet/ 目录
# 2. 重命名为 train_YourNet_x4.yml (x4 表示4倍超分)
# 3. 修改网络、数据集、训练参数等
# 4. 运行: python basicsr/train.py -opt options/train/YourNet/train_YourNet_x4.yml
# ============================================================================

# ====== 基本信息 ======
name: MyNet_x4_DIV2K          # 实验名称，会创建对应的输出文件夹
model_type: SRModel           # 模型类型: SRModel | SRGANModel | VideoRecurrentModel | 自定义Model
scale: 4                      # 超分倍数: 1 | 2 | 3 | 4 | 8
num_gpu: auto                 # GPU 数量: auto | 0(CPU) | 1 | 2 | 4 ...
manual_seed: 0                # 随机种子，保证可重复性

# ====== 数据集配置 ======
datasets:
  train:
    name: DIV2K                # 数据集名称
    type: PairedImageDataset   # 数据集类型（必须在 DATASET_REGISTRY 中注册）

    # 数据路径
    dataroot_gt: datasets/DIV2K/DIV2K_train_HR         # GT (高质量) 图像路径
    dataroot_lq: datasets/DIV2K/DIV2K_train_LR_bicubic/X4  # LQ (低质量) 图像路径

    # 文件名模板（可选）
    # filename_tmpl: '{}'       # 默认，LQ 和 GT 文件名相同
    # filename_tmpl: '{}_x4'    # LQ 文件名为 GT 文件名 + _x4

    # IO 后端
    io_backend:
      type: disk                # disk | lmdb | memcached

    # 数据增强
    gt_size: 128                # GT patch 大小（会裁剪出 128x128 的 patch）
    use_hflip: true             # 随机水平翻转
    use_rot: true               # 随机旋转 (90, 180, 270 度)

    # DataLoader 设置
    num_worker_per_gpu: 6       # 每个 GPU 的 worker 数量
    batch_size_per_gpu: 16      # 每个 GPU 的 batch size
    dataset_enlarge_ratio: 100  # 数据集放大倍数（一个 epoch 的迭代次数）
    prefetch_mode: ~            # 预取模式: ~ (None) | cpu | cuda

  val:
    name: Set5                  # 验证集名称
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/GTmod12
    dataroot_lq: datasets/Set5/LRbicx4
    io_backend:
      type: disk

# ====== 网络配置 ======
network_g:
  type: MyNet                   # 网络类型（必须在 ARCH_REGISTRY 中注册）
  num_in_ch: 3                  # 输入通道数 (RGB=3, 灰度=1)
  num_out_ch: 3                 # 输出通道数
  num_feat: 64                  # 特征通道数
  num_block: 16                 # 网络块数量
  upscale: 4                    # 上采样倍数
  # 添加你的网络特定参数...

# ====== 路径配置 ======
path:
  pretrain_network_g: ~         # 预训练模型路径，~ 表示从头训练
  strict_load_g: true           # 是否严格加载（参数必须完全匹配）
  resume_state: ~               # 恢复训练的 state 文件路径

# ====== 训练配置 ======
train:
  # EMA (Exponential Moving Average)
  ema_decay: 0.999              # EMA 衰减系数，0 表示不使用

  # 优化器 - 生成器
  optim_g:
    type: Adam                  # 优化器类型: Adam | AdamW | SGD
    lr: !!float 1e-4           # 学习率 (!!float 强制为浮点数)
    weight_decay: 0             # L2 正则化系数
    betas: [0.9, 0.99]         # Adam 的 beta 参数

  # 学习率调度器
  scheduler:
    type: MultiStepLR           # 调度器类型: MultiStepLR | CosineAnnealingRestartLR
    milestones: [200000, 400000, 600000, 800000]  # 降低学习率的迭代次数
    gamma: 0.5                  # 学习率衰减倍数

  # 训练迭代设置
  total_iter: 1000000           # 总迭代次数
  warmup_iter: -1               # 预热迭代次数，-1 表示不使用

  # ====== 损失函数 ======
  # 像素损失
  pixel_opt:
    type: L1Loss                # 损失类型: L1Loss | MSELoss | CharbonnierLoss
    loss_weight: 1.0            # 损失权重
    reduction: mean             # 归约方式: mean | sum

  # 感知损失（可选）
  # perceptual_opt:
  #   type: PerceptualLoss
  #   layer_weights:
  #     'conv5_4': 1.0          # VGG 层权重
  #   vgg_type: vgg19
  #   use_input_norm: true
  #   perceptual_weight: 1.0
  #   style_weight: 0
  #   criterion: l1

# ====== 验证配置 ======
val:
  val_freq: !!float 5e3         # 验证频率（每多少次迭代验证一次）
  save_img: false               # 是否保存验证图像

  # 评估指标
  metrics:
    psnr:                       # PSNR 指标
      type: calculate_psnr
      crop_border: 4            # 裁剪边界（避免边界效应）
      test_y_channel: false     # 是否只在 Y 通道测试

    # SSIM 指标（可选）
    # ssim:
    #   type: calculate_ssim
    #   crop_border: 4
    #   test_y_channel: false

# ====== 日志配置 ======
logger:
  print_freq: 100               # 打印日志频率（每多少次迭代）
  save_checkpoint_freq: !!float 5e3  # 保存模型频率
  use_tb_logger: true           # 是否使用 TensorBoard

  # TensorBoard 配置（可选）
  tb_logger:
    log_dir: ~                  # TensorBoard 日志目录，~ 使用默认
    flush_secs: 120             # 刷新间隔

  # Wandb 配置（可选）
  wandb:
    project: ~                  # Wandb 项目名，~ 表示不使用
    resume_id: ~                # 恢复 Wandb run ID

# ====== 分布式训练配置（可选） ======
dist_params:
  backend: nccl                 # 分布式后端: nccl | gloo
  port: 29500                   # 主节点端口


# ============================================================================
# 常用配置模板
# ============================================================================

# --- 配置 1: 标准图像超分 ---
# model_type: SRModel
# network_g: 你的超分网络
# train/pixel_opt: L1Loss 或 CharbonnierLoss

# --- 配置 2: GAN 训练 ---
# model_type: SRGANModel
# network_g: 生成器
# network_d: 判别器
# train/optim_d: 判别器优化器
# train/gan_opt: GAN 损失

# --- 配置 3: 快速调试 ---
# name: debug_MyNet
# datasets/train/batch_size_per_gpu: 4
# datasets/train/num_worker_per_gpu: 0
# val/val_freq: 100
# logger/print_freq: 10


# ============================================================================
# 运行命令
# ============================================================================

# 单 GPU 训练:
#   python basicsr/train.py -opt this_config.yml

# 多 GPU 训练 (4 GPU):
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#   python -m torch.distributed.launch --nproc_per_node=4 --master_port=4321 \
#   basicsr/train.py -opt this_config.yml --launcher pytorch

# Debug 模式:
#   python basicsr/train.py -opt this_config.yml --debug

# 强制覆盖配置:
#   python basicsr/train.py -opt this_config.yml --force_yml train:ema_decay=0.999

